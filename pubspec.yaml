name: pisni
description: "A new Flutter project."
publish_to: 'none'
version: 1.5.1+10

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Storage
  drift: ^2.34.0
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.5

  # Firebase
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0

  # Bloc
  flutter_bloc: ^9.1.1

  # UI
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  vector_graphics: ^1.2.3
  vector_graphics_compiler: ^1.3.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2

  # Utils
  json_annotation: 4.12.0
  freezed_annotation: ^3.1.0
  path_provider: ^2.1.6
  get_it: ^9.3.0

dev_dependencies:
  json_serializable: 6.14.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  drift_dev: ">=2.32.0 <2.34.6"
  test: ^1.30.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/songs/
    - assets/icons/
